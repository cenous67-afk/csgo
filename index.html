<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
  :root{
    --accent:#ffcc00;
    --text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--text);
    background:#0b1020;
    overflow-x:hidden;
  }

  /* ---------- Фон ---------- */
  .bg{
    position:fixed;inset:0;z-index:-3;
    background:
      radial-gradient(1200px 800px at 10% 20%, #2b1055 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 10%, #0f3460 0%, transparent 60%),
      radial-gradient(900px 900px at 50% 100%, #1a1a40 0%, transparent 60%),
      linear-gradient(160deg,#0b1020,#141b3a 60%,#0b1020);
    background-size:200% 200%,200% 200%,200% 200%,200% 200%;
    animation:drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{background-position:0% 0%,100% 0%,50% 100%,0% 0%}
    100%{background-position:100% 100%,0% 100%,50% 0%,100% 100%}
  }
  .bg-image{
    position:fixed;inset:0;z-index:-2;
    background-size:cover;background-position:center;
    background-image:var(--bg-img);
    display:none;
  }
  .overlay{
    position:fixed;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));
    pointer-events:none;
  }

  /* ---------- Каркас ---------- */
  .app{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 24px 48px;
    gap:4vh;
  }

  /* ---------- Часы ---------- */
  .clock{text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.45)}
  .time{
    font-size:clamp(64px,14vw,150px);
    font-weight:200;
    line-height:1;
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .time .sec{font-size:.32em;vertical-align:top;opacity:.6;margin-left:.15em}
  .date{
    margin-top:8px;
    font-size:clamp(14px,1.6vw,18px);
    opacity:.85;
    text-transform:capitalize;
  }
  .greeting{
    margin-top:14px;
    font-size:clamp(16px,2vw,22px);
    font-weight:300;
    opacity:.9;
  }

  /* ---------- Поиск ---------- */
  .search{
    display:flex;
    width:min(680px,100%);
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-radius:999px;
    padding:6px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    font-size:17px;
    padding:12px 20px;
  }
  .search input::placeholder{color:rgba(255,255,255,.6)}
  .search button{
    background:var(--accent);
    color:#1a1a1a;
    border:0;
    border-radius:999px;
    padding:0 24px;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
  }
  .search button:hover{filter:brightness(1.08)}

  /* ---------- Быстрые ссылки ---------- */
  .links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }
  .links a{
    color:#fff;
    text-decoration:none;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    transition:.2s;
    backdrop-filter:blur(8px);
  }
  .links a:hover{background:rgba(255,255,255,.18)}

  /* ---------- Новости ---------- */
  .news{width:min(1100px,100%)}
  .news-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 4px;
  }
  .news-head h2{
    font-size:14px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    opacity:.8;
  }
  .refresh{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
    transition:.2s;
  }
  .refresh:hover{background:rgba(255,255,255,.2)}
  .news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
  }
  .card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    text-decoration:none;
    color:#fff;
    transition:.2s;
    min-height:110px;
  }
  .card:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
  .card .src{
    font-size:10px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    opacity:.65;
  }
  .card .title{
    font-size:14px;
    line-height:1.35;
    font-weight:500;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .time{
    margin-top:auto;
    font-size:11px;
    opacity:.55;
  }
  .skeleton{
    height:110px;border-radius:16px;
    background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{to{background-position:-200% 0}}

  /* ---------- Настройки ---------- */
  .gear{
    position:fixed;
    right:22px;bottom:22px;
    width:46px;height:46px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(12px);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.2s;
    z-index:10;
  }
  .gear:hover{background:rgba(255,255,255,.22);transform:rotate(30deg)}
  .panel{
    position:fixed;
    right:22px;bottom:80px;
    width:300px;
    background:rgba(20,24,40,.85);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border-radius:18px;
    padding:18px;
    display:none;
    flex-direction:column;
    gap:12px;
    z-index:10;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .panel.open{display:flex}
  .panel label{font-size:12px;opacity:.75;display:block;margin-bottom:5px}
  .panel input{
    width:100%;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:13px;
    outline:0;
  }
  .panel input:focus{border-color:var(--accent)}
  .panel .row{display:flex;gap:8px}
  .panel button{
    flex:1;
    padding:9px;
    border-radius:10px;
    border:0;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .panel .save{background:var(--accent);color:#1a1a1a}
  .panel .reset{background:rgba(255,255,255,.12);color:#fff}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-image" id="bgImage"></div>
<div class="overlay"></div>

<div class="app">
  <div class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
    <div class="greeting" id="greeting"></div>
  </div>

  <form class="search" action="https://yandex.ru/search/" method="get" autocomplete="off">
    <input type="text" name="text" id="q" placeholder="Поиск в Яндексе…" autofocus>
    <button type="submit">Найти</button>
  </form>

  <div class="links">
    <a href="https://yandex.ru" target="_blank">Яндекс</a>
    <a href="https://mail.yandex.ru" target="_blank">Почта</a>
    <a href="https://music.yandex.ru" target="_blank">Музыка</a>
    <a href="https://github.com" target="_blank">GitHub</a>
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
    <a href="https://t.me" target="_blank">Telegram</a>
  </div>

  <section class="news">
    <div class="news-head">
      <h2>Новости</h2>
      <button class="refresh" id="refresh">Обновить</button>
    </div>
    <div class="news-grid" id="newsGrid">
      <div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>
</div>

<button class="gear" id="gear" title="Настройки">⚙</button>
<div class="panel" id="panel">
  <div>
    <label>Ваше имя (для приветствия)</label>
    <input type="text" id="inpName" placeholder="Например, Алексей">
  </div>
  <div>
    <label>Ссылка на фоновое изображение</label>
    <input type="url" id="inpBg" placeholder="https://…/photo.jpg">
  </div>
  <div class="row">
    <button class="save" id="save">Сохранить</button>
    <button class="reset" id="reset">Сброс</button>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);

  /* ---------- Настройки ---------- */
  const store = {
    get: k => localStorage.getItem(k),
    set: (k, v) => v ? localStorage.setItem(k, v) : localStorage.removeItem(k)
  };

  function applySettings() {
    const bg = store.get('ntp_bg');
    const img = $('#bgImage');
    if (bg) {
      img.style.setProperty('--bg-img', `url("${bg}")`);
      img.style.display = 'block';
    } else {
      img.style.display = 'none';
    }
  }
  applySettings();

  $('#gear').onclick = () => {
    $('#panel').classList.toggle('open');
    $('#inpName').value = store.get('ntp_name') || '';
    $('#inpBg').value = store.get('ntp_bg') || '';
  };
  $('#save').onclick = () => {
    store.set('ntp_name', $('#inpName').value.trim());
    store.set('ntp_bg', $('#inpBg').value.trim());
    applySettings();
    updateClock();
    $('#panel').classList.remove('open');
  };
  $('#reset').onclick = () => {
    store.set('ntp_name', '');
    store.set('ntp_bg', '');
    $('#inpName').value = '';
    $('#inpBg').value = '';
    applySettings();
    updateClock();
  };

  /* ---------- Часы ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }

  function greeting(h) {
    const name = store.get('ntp_name');
    let g;
    if (h >= 5 && h < 12) g = 'Доброе утро';
    else if (h >= 12 && h < 18) g = 'Добрый день';
    else if (h >= 18 && h < 23) g = 'Добрый вечер';
    else g = 'Доброй ночи';
    return name ? `${g}, ${name}!` : `${g}!`;
  }

  function updateClock() {
    const now = new Date();
    $('#time').innerHTML = `${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span>`;
    $('#date').textContent = now.toLocaleDateString('ru-RU', {
      weekday: 'long', day: 'numeric', month: 'long'
    });
    $('#greeting').textContent = greeting(now.getHours());
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ---------- Новости ---------- */
  const FEEDS = [
    { name: 'Lenta',    url: 'https://lenta.ru/rss/news' },
    { name: 'RBC',      url: 'https://rssexport.rbc.ru/rbcnews/news/30/full.rss' },
    { name: 'TASS',     url: 'https://tass.ru/rss/v2.xml' },
    { name: 'Interfax', url: 'https://www.interfax.ru/rss.asp' }
  ];
  const CACHE_KEY = 'ntp_news_cache';
  const CACHE_TTL = 15 * 60 * 1000; // 15 минут

  const grid = $('#newsGrid');

  function timeAgo(ts) {
    if (!ts) return '';
    const diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 1) return 'только что';
    if (diff < 60) return `${diff} мин назад`;
    const h = Math.floor(diff / 60);
    if (h < 24) return `${h} ч назад`;
    return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  }

  function render(items) {
    if (!items.length) { renderFallback(); return; }
    grid.innerHTML = items.map(it => `
      <a class="card" href="${it.link}" target="_blank" rel="noopener">
        <div class="src">${it.source}</div>
        <div class="title">${it.title}</div>
        <div class="time">${timeAgo(it.date)}</div>
      </a>
    `).join('');
  }

  function renderFallback() {
    const sites = [
      ['Lenta.ru', 'https://lenta.ru'],
      ['РБК', 'https://www.rbc.ru'],
      ['ТАСС', 'https://tass.ru'],
      ['Интерфакс', 'https://www.interfax.ru'],
      ['Коммерсантъ', 'https://www.kommersant.ru'],
      ['РИА Новости', 'https://ria.ru'],
      ['Meduza', 'https://meduza.io'],
      ['Хабр', 'https://habr.com/ru/news/']
    ];
    grid.innerHTML = sites.map(([n, u]) => `
      <a class="card" href="${u}" target="_blank" rel="noopener">
        <div class="src">${n}</div>
        <div class="title">Открыть новости ${n}</div>
        <div class="time">перейти на сайт →</div>
      </a>
    `).join('');
  }

  async function fetchFeed(f) {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}&count=6`;
    const r = await fetch(url);
    const j = await r.json();
    if (j.status !== 'ok' || !Array.isArray(j.items)) throw new Error('bad feed');
    return j.items.map(it => ({
      title: it.title,
      link: it.link,
      source: f.name,
      date: Date.parse(it.pubDate) || 0
    }));
  }

  async function loadNews(force = false) {
    try {
      const cached = JSON.parse(store.get(CACHE_KEY) || 'null');
      if (!force && cached && Date.now() - cached.t < CACHE_TTL) {
        render(cached.items);
        return;
      }
      const results = await Promise.allSettled(FEEDS.map(fetchFeed));
      let items = [];
      results.forEach(r => { if (r.status === 'fulfilled') items.push(...r.value); });
      // убираем дубликаты по заголовку
      const seen = new Set();
      items = items.filter(i => {
        if (seen.has(i.title)) return false;
        seen.add(i.title);
        return true;
      }).sort((a, b) => b.date - a.date).slice(0, 12);

      if (items.length) {
        store.set(CACHE_KEY, JSON.stringify({ t: Date.now(), items }));
        render(items);
      } else {
        renderFallback();
      }
    } catch (e) {
      renderFallback();
    }
  }

  $('#refresh').onclick = () => {
    grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    loadNews(true);
  };

  loadNews();

  /* ---------- Клавиша "/" фокусирует поиск ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#q') && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      $('#q').focus();
    }
    if (e.key === 'Escape') {
      $('#panel').classList.remove('open');
      $('#q').blur();
    }
  });
})();
</script>
</body>
</html>
